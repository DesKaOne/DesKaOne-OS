name: Documentation or repository issue
description: Report a broken link, documentation defect, or repository configuration problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No OS images or packages have been released. Do not report runtime OS bugs for builds that do not exist. Do not disclose vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or links to reproduce
    validations:
      required: true
